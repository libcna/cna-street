# Pinned upstream revisions cna-street is developed and verified against.
#
# cna-street consumes CNA as a sibling checkout (CNA installs no CMake package),
# and CNA in turn expects sharp-runtime, easy-gl and meta-gl as *its own* siblings.
# scripts/fetch-dependencies.sh clones this exact set next to this repository.
#
# You are not required to pin these: the build works against any compatible
# revision. They exist so a build failure can be attributed -- if it reproduces
# at these SHAs it is cna-street's problem, and if it does not it arrived with an
# upstream change.
#
# Which of these you need depends on the renderer:
#   CNA, SHARP_RUNTIME     always
#   EASY_GL, META_GL       the GL renderer family (OPENGL33/OPENGLES3/OPENGLES2)
#
# branch=next
CNA=756096626cfb537e32ac8ccc6b0743a23c57ddfd
# branch=next
