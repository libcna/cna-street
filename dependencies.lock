# Pinned upstream revisions cna-street is developed and verified against.
#
# cna-street consumes CNA as a sibling checkout (CNA installs no CMake package),
# and CNA in turn expects sharp-runtime, easy-gl and meta-gl as *its own* siblings.
# scripts/fetch-dependencies.sh clones this exact set next to this repository.
#
# You are not required to pin these: the build works against any compatible
# revision. They exist so a build failure can be attributed -- if it reproduces
# at these SHAs it is cna-street's problem, and if it does not it arrived with an
# upstream change.
#
# Which of these you need depends on the renderer:
#   CNA, SHARP_RUNTIME     always
#   EASY_GL, META_GL       the GL renderer family (OPENGL33/OPENGLES3/OPENGLES2)
#
# The CNAEXT engine layer this project is built on -- RenderPipeline,
# CascadedShadowMap, AtmosphericSky, EnvironmentProcessor -- lives on CNA's
# `next` branch. CNA's `develop` branch does not carry it (checked 2026-09-05
# at 1bb2145: modules/graphics-ext has nine headers there against ninety-three
# on `next`), so a checkout on `develop` fails to compile this project with
# "CNA/Graphics/CascadedShadowMap.hpp: No such file". Point CNA_ROOT_DIR at a
# `next` checkout, and CNA_SHARP_RUNTIME_ROOT at a sharp-runtime `next`
# checkout to match.
# The eighth pass (2026-09-06) built and verified against these. Another agent
# was committing to the CNA `next` checkout during that session (6e22a44b6,
# 4bf74e31b, d42203805 in turn); the SHA below is the one checked out when the
# final build, the test run and the benchmark baseline were made.
# branch=next
CNA=d42203805057d43dc092bb713613bcc945ad8d5a
# branch=next
SHARP_RUNTIME=30ccdef30ba4d27534864b0777729b9e78ee8a21
# branch=develop
EASY_GL=deda7a426c3c166c0e03a4790f1ede610e2e46fb
# branch=develop
META_GL=20c8b2dc5bb80e32706784066db9fd9e15b3f46a
